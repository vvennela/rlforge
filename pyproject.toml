[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akshara-forge"
version = "0.1.0"
description = "Paper artifacts, reproducible mathematics tasks, and standalone RL evaluation environments"
requires-python = ">=3.11"
dependencies = ["pymupdf>=1.25,<2", "httpx>=0.28,<1", "pydantic>=2.10,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
train = ["torch>=2.6", "transformers>=4.51", "trl>=0.19", "peft>=0.15", "datasets>=3"]

[project.scripts]
forge = "akshara_forge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/akshara_forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
